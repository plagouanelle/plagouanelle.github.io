      - bullet: "2023 – 2025: Postdoctoral fellow representative at LATMOS lab council, LATMOS, Université Paris-Saclay"
      - bullet: "2021 – 2023: Responsible for the GeePs lab cafeteria, GeePs, Université Paris-Saclay"
